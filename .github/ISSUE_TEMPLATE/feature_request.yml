name: Feature proposal
description: Propose a focused improvement
title: "[Proposal] "
labels: ["enhancement", "needs-discussion"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem before the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy, security, and compatibility impact
    validations:
      required: true
